[project]
name = "nepal-interview"
version = "0.1.0"
description = "Mock UK pre-CAS interview practice: ElevenLabs voice agent and HeyGen LiveAvatar, with credits, facts and feedback"
requires-python = ">=3.11,<3.15"
license = "UNLICENSED"
dependencies = [
    # Session API
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["packages/core", "services/api"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core", "services/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() idiom
